<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Music Island">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0b14"/>
      <stop offset="0.55" stop-color="#14102a"/>
      <stop offset="1" stop-color="#2a0f3a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb347"/>
      <stop offset="0.5" stop-color="#ff4d94"/>
      <stop offset="1" stop-color="#7b61ff"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#ff4d94" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff4d94" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.9" r="0.55">
      <stop offset="0" stop-color="#7b61ff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#7b61ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-40%" width="140%" height="200%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glowA)"/>
  <rect width="1280" height="360" fill="url(#glowB)"/>

  <!-- «остров» -->
  <g filter="url(#shadow)">
    <rect x="290" y="70" width="700" height="150" rx="75" fill="#000"/>
    <rect x="290.5" y="70.5" width="699" height="149" rx="74.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  </g>
  <rect x="318" y="98" width="94" height="94" rx="47" fill="url(#accent)"/>
  <path d="M352 126v38a13 13 0 1 0 8 12v-32l22-5v-12z" fill="#fff" fill-opacity="0.95"/>

  <!-- волна -->
  <g fill="url(#accent)" opacity="0.95">
    <rect x="450" y="132" width="8" height="26" rx="4"/><rect x="466" y="118" width="8" height="54" rx="4"/>
    <rect x="482" y="104" width="8" height="82" rx="4"/><rect x="498" y="124" width="8" height="42" rx="4"/>
    <rect x="514" y="112" width="8" height="66" rx="4"/><rect x="530" y="128" width="8" height="34" rx="4"/>
    <rect x="546" y="100" width="8" height="90" rx="4"/><rect x="562" y="116" width="8" height="58" rx="4"/>
    <rect x="578" y="134" width="8" height="22" rx="4"/><rect x="594" y="110" width="8" height="70" rx="4"/>
    <rect x="610" y="122" width="8" height="46" rx="4"/><rect x="626" y="104" width="8" height="82" rx="4"/>
    <rect x="642" y="128" width="8" height="34" rx="4"/><rect x="658" y="114" width="8" height="62" rx="4"/>
    <rect x="674" y="132" width="8" height="26" rx="4"/><rect x="690" y="108" width="8" height="74" rx="4"/>
  </g>
  <g fill="#ffffff" fill-opacity="0.28">
    <rect x="706" y="126" width="8" height="38" rx="4"/><rect x="722" y="138" width="8" height="14" rx="4"/>
    <rect x="738" y="120" width="8" height="50" rx="4"/><rect x="754" y="134" width="8" height="22" rx="4"/>
    <rect x="770" y="124" width="8" height="42" rx="4"/><rect x="786" y="138" width="8" height="14" rx="4"/>
    <rect x="802" y="130" width="8" height="30" rx="4"/><rect x="818" y="140" width="8" height="10" rx="4"/>
  </g>

  <!-- кнопки -->
  <circle cx="900" cy="145" r="30" fill="#fff"/>
  <path d="M891 130v30a2 2 0 0 0 3 1.7l23-15a2 2 0 0 0 0-3.4l-23-15a2 2 0 0 0-3 1.7z" fill="#000"/>
  <path d="M948 128v34M948 145l-18-12v24z" fill="none" stroke="#fff" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>

  <!-- название -->
  <text x="640" y="286" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" fill="#fff" letter-spacing="1">Music Island</text>
  <text x="640" y="326" text-anchor="middle" font-family="Segoe UI, Inter, Helvetica, Arial, sans-serif" font-size="22" fill="#fff" fill-opacity="0.62">Dynamic Island для вашей музыки на рабочем столе Windows</text>
</svg>
