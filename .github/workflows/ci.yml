name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Tests and site checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Site is up to date and valid
        shell: bash
        run: |
          node scripts/build-site.js
          git diff --exit-code --ignore-cr-at-eol -- docs || (echo "docs/ is out of date: run node scripts/build-site.js and commit" && exit 1)
          node scripts/check-site.js

  spotify-host:
    name: Build Spotify helper (SpotifyHost.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm run build:spotify
      - uses: actions/upload-artifact@v4
        with:
          name: spotify-host
          path: bin/spotify-host
          retention-days: 14

  links:
    name: Documentation links
    runs-on: ubuntu-latest
    continue-on-error: true # внешние сайты бывают недоступны: результат информационный
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,206,403,429 --exclude 'localhost' --exclude 'img.shields.io' --exclude 'github.com/luviel19/Music_Island/(actions|releases)' README.md README.ru.md SECURITY.md CONTRIBUTING.md
          fail: true
